<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A &amp; P Mamas Developers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ffffff; --mist:#f4f5f6; --ink:#141d24; --stone:#39454f; --line:#e7eaec;
  --navy:#0f2a38; --blue:#1D8FCB; --orange:#F67E1F; --orange-dark:#df6b10; --grey:#9aa7b0;
  --display:'Space Grotesk',system-ui,sans-serif; --radius:5px; --maxw:1240px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;background:var(--paper)}
body{font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:transparent;line-height:1.6;-webkit-font-smoothing:antialiased}
#bg3d{position:fixed;inset:0;width:100%;height:100%;z-index:-2;display:block;pointer-events:none}
#bg3d-veil{position:fixed;inset:0;z-index:-1;pointer-events:none;background:rgba(241,244,246,.45)}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.05;letter-spacing:-.02em}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 30px}
.eyebrow{font-family:var(--display);font-size:.74rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--orange)}

header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:78px;gap:16px}
.brand{display:flex;align-items:center;gap:13px;min-width:0}
.logo{height:44px;width:auto;flex:none}
.brand-name{font-family:var(--display);font-weight:600;font-size:1.02rem;letter-spacing:-.01em;color:var(--ink);white-space:nowrap}
.nav-links{display:flex;gap:22px;font-size:.86rem;font-weight:500;align-items:center;font-family:var(--display)}
.nav-links>a{color:var(--stone)}
.nav-links>a:hover{color:var(--ink)}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{border:none;background:none;font-family:var(--display);font-size:.75rem;font-weight:600;padding:7px 11px;cursor:pointer;color:var(--stone);transition:.15s}
.lang button.active{background:var(--ink);color:#fff}
.nav-cta{padding:11px 20px;border-radius:var(--radius);background:var(--ink);color:#fff!important;font-size:.82rem;transition:.2s;white-space:nowrap}
.nav-cta:hover{background:var(--orange)}
@media(max-width:820px){.brand-name{font-size:.9rem}.nav-links{gap:14px}}
@media(max-width:680px){.nav-links>a:not(.nav-cta){display:none}}
@media(max-width:430px){.brand-name{display:none}}

.hero{position:relative;height:min(82vh,780px);min-height:520px;overflow:hidden;background:var(--navy)}
.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero-scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,42,56,.15) 0%,rgba(15,42,56,.25) 40%,rgba(15,42,56,.82) 100%)}
.hero-slides{position:absolute;inset:0}
.hero-slide{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.6s ease;transform:scale(1.06)}
.hero-slide.active{opacity:1;animation:kb 6.5s ease-out forwards}
@keyframes kb{from{transform:scale(1.06)}to{transform:scale(1.14)}}
.hero-inner{position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:60px}
.hero-inner .eyebrow{color:#fff;opacity:.9;margin-bottom:20px;animation:rise .7s .05s both}
.hero h1{color:#fff;font-size:clamp(2.9rem,6.4vw,5.2rem);letter-spacing:-.035em;line-height:1;margin-bottom:30px;max-width:16ch;animation:rise .7s .12s both}
.hero-actions{animation:rise .7s .2s both}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.btn{display:inline-flex;align-items:center;gap:10px;padding:15px 30px;border-radius:var(--radius);font-family:var(--display);font-weight:500;font-size:.92rem;transition:.2s;cursor:pointer}
.btn-solid{background:var(--orange);color:#fff}
.btn-solid:hover{background:var(--orange-dark);transform:translateY(-1px)}
.btn .ar{transition:transform .2s}
.btn:hover .ar{transform:translateX(3px)}
@media(max-width:680px){.hero{height:auto;min-height:0;padding:0}.hero-inner{padding:120px 0 44px}}

.sec-head{padding:78px 0 34px;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px}
.sec-head .eyebrow{display:block;margin-bottom:14px}
.sec-head h2{font-size:clamp(2rem,3.2vw,2.7rem)}
.sec-head .count{font-family:var(--display);color:var(--stone);font-size:.9rem}

.filters{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:38px}
.chip{padding:9px 18px;border:1px solid var(--line);border-radius:999px;background:var(--paper);font-family:var(--display);font-size:.82rem;font-weight:500;cursor:pointer;transition:.18s;color:var(--stone)}
.chip:hover{border-color:var(--ink);color:var(--ink)}
.chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}

.grid{display:grid;gap:26px;padding-bottom:96px;grid-template-columns:repeat(auto-fill,minmax(400px,1fr))}
.card{position:relative;border-radius:var(--radius);overflow:hidden;cursor:pointer;aspect-ratio:4/3;background:var(--mist)}
.card>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s ease}
.card:hover>img{transform:scale(1.05)}
.card-overlay{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:28px;background:linear-gradient(180deg,rgba(15,42,56,0) 38%,rgba(15,42,56,.55) 72%,rgba(15,42,56,.9) 100%)}
.card-title{font-family:var(--display);color:#fff;font-size:1.75rem;font-weight:600;letter-spacing:-.02em;line-height:1.04}
.card-loc{color:rgba(255,255,255,.82);font-size:.92rem;margin-top:5px}
.card-view{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;margin-top:18px;padding:10px 18px;border:1px solid rgba(255,255,255,.5);border-radius:999px;font-family:var(--display);font-weight:500;font-size:.82rem;color:#fff;transition:.22s}
.card-view .ar{transition:transform .2s}
.card:hover .card-view{background:var(--orange);border-color:var(--orange)}
.card:hover .card-view .ar{transform:translateX(4px)}
@media(max-width:520px){.grid{grid-template-columns:1fr}.card-title{font-size:1.5rem}}

#detail{padding:42px 0 104px}
.view{display:none}
.view.active{display:block}
.view.page{padding-top:44px;padding-bottom:60px}
#view-contact{margin-top:0;padding:88px 0}
.home-intro{padding:74px 0 40px}
.home-intro .eyebrow{display:block;margin-bottom:14px}
.home-intro h2{font-size:clamp(2rem,3.4vw,2.8rem);margin-bottom:18px;max-width:18ch}
.home-intro p{color:var(--stone);font-size:1.08rem;max-width:56ch;margin-bottom:30px}
.hi-actions{display:flex;gap:12px;flex-wrap:wrap}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--ink)}
.back{display:inline-flex;align-items:center;gap:8px;color:var(--stone);font-family:var(--display);font-weight:500;margin-bottom:32px;cursor:pointer;background:none;border:none;font-size:.88rem}
.back:hover{color:var(--ink)}
.detail-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:52px}
@media(max-width:880px){.detail-grid{grid-template-columns:1fr;gap:34px}}
.gallery-main{aspect-ratio:16/11;border-radius:var(--radius);overflow:hidden;background:var(--mist)}
.gallery-main img{width:100%;height:100%;object-fit:cover}
.thumbs{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.thumb{width:92px;height:66px;border-radius:4px;overflow:hidden;cursor:pointer;opacity:.55;transition:.18s}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb.active,.thumb:hover{opacity:1}
.detail-status{display:inline-block;font-family:var(--display);font-size:.76rem;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--orange);margin-bottom:14px}
.detail-title{font-size:clamp(2.1rem,4vw,3rem);letter-spacing:-.03em;margin-bottom:8px}
.detail-loc{color:var(--stone);margin-bottom:28px;display:flex;align-items:center;gap:7px}
.spec-row{display:grid;grid-template-columns:repeat(2,1fr);gap:22px 20px;margin-bottom:30px;padding-bottom:30px;border-bottom:1px solid var(--line)}
.spec small{display:block;font-family:'Inter';color:var(--stone);font-size:.74rem;letter-spacing:.07em;text-transform:uppercase;margin-bottom:5px}
.spec b{font-family:var(--display);font-size:1.3rem;font-weight:600;letter-spacing:-.01em}
.contact-box{background:var(--navy);color:#fff;padding:32px;border-radius:var(--radius);position:sticky;top:100px}
.contact-box h3{color:#fff;font-size:1.5rem;margin-bottom:6px}
.contact-box p{color:rgba(255,255,255,.68);font-size:.9rem;margin-bottom:24px}
.contact-box a{display:flex;align-items:center;gap:11px;padding:14px 16px;border-radius:var(--radius);font-family:var(--display);font-weight:500;font-size:.9rem;margin-bottom:10px;transition:.2s}
.btn-primary{background:var(--orange);color:#fff}
.btn-primary:hover{background:var(--orange-dark)}
.btn-outline{border:1px solid rgba(255,255,255,.22);color:#fff}
.btn-outline:hover{background:rgba(255,255,255,.08)}

.section-block{max-width:940px;margin-top:54px}
.section-block h2{font-size:1.7rem;margin-bottom:20px;letter-spacing:-.02em}
.units-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius)}
table.units{width:100%;border-collapse:collapse;min-width:600px;background:var(--paper)}
table.units th{text-align:left;font-family:'Inter';font-size:.72rem;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--stone);padding:16px 22px;border-bottom:1px solid var(--line)}
table.units td{padding:17px 22px;border-bottom:1px solid var(--line);font-size:.93rem}
table.units tr:last-child td{border-bottom:none}
table.units tr:hover td{background:var(--mist)}
table.units .u-price{font-family:var(--display);font-weight:600;font-size:1.05rem}
.st{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);font-size:.84rem;font-weight:500}
.st .dot{width:8px;height:8px;border-radius:50%;flex:none}
tr.sold td{color:var(--stone)}
tr.sold .u-price{text-decoration:line-through;color:var(--grey)}
.detail-desc{margin-bottom:24px;color:#3d525e;font-size:1.02rem}
.features{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:13px}
.features li{position:relative;padding-left:22px;font-size:.94rem}
.features li::before{content:"";position:absolute;left:0;top:9px;width:7px;height:7px;background:var(--orange);border-radius:50%}
.map{width:100%;aspect-ratio:16/9;border:1px solid var(--line);border-radius:var(--radius);margin-top:6px}

.about{padding:24px 0 40px}
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.about-copy .eyebrow{display:block;margin-bottom:14px}
.about-copy h2{font-size:clamp(2rem,3.2vw,2.7rem);margin-bottom:20px}
.about-copy p{color:var(--stone);font-size:1.05rem;margin-bottom:28px;max-width:52ch}
.about-img{aspect-ratio:4/3;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line)}
.about-img img{width:100%;height:100%;object-fit:cover}
@media(max-width:820px){.about-grid{grid-template-columns:1fr;gap:30px}.about-img{order:-1}}

.contact{background:var(--navy);color:#fff;padding:92px 0;margin-top:28px}
.contact .eyebrow{color:var(--orange);display:block;margin-bottom:16px}
.contact h2{color:#fff;font-size:clamp(2rem,3.4vw,2.9rem);letter-spacing:-.03em;margin-bottom:18px;max-width:16ch}
.contact p{color:rgba(255,255,255,.68);max-width:50ch;margin-bottom:32px}
.contact-links{display:flex;gap:12px;flex-wrap:wrap}
.contact-links a{display:inline-flex;align-items:center;gap:10px;padding:14px 24px;border-radius:var(--radius);font-family:var(--display);font-weight:500;font-size:.9rem;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);transition:.2s}
.contact-links a:hover{background:var(--orange);border-color:var(--orange)}
footer{padding:34px 0;text-align:center;color:var(--stone);font-family:var(--display);font-size:.82rem;border-top:1px solid var(--line)}
svg{flex:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:focus-visible{outline:2px solid var(--orange);outline-offset:3px}
.detail-price{font-family:var(--display);font-size:1.35rem;font-weight:600;color:var(--orange);margin:-12px 0 22px}
.detail-actions{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:26px}
.detail-actions .btn{padding:12px 20px;font-size:.85rem;border:none}
.detail-actions .btn-ghost{border:1px solid var(--line);color:var(--ink)}
.price-note{color:var(--stone);font-size:.8rem;margin-top:12px}
table.units{min-width:840px}
table.units th,table.units td{padding:12px 12px;font-size:.85rem}
table.units th{white-space:nowrap}
.tag-re{color:var(--orange);font-weight:600}
.tag-so{color:var(--grey);font-weight:600;letter-spacing:.03em}
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start}
@media(max-width:820px){.contact-grid{grid-template-columns:1fr;gap:36px}}
.contact-info h2{margin-bottom:16px}
.contact-form{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);border-radius:var(--radius);padding:26px}
.fld{margin-bottom:15px;display:flex;flex-direction:column}
.fld label{font-family:var(--display);font-size:.76rem;font-weight:500;letter-spacing:.05em;color:rgba(255,255,255,.75);margin-bottom:7px}
.contact-form input,.contact-form select,.contact-form textarea{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:6px;padding:12px 14px;color:#fff;font-family:'Inter';font-size:.95rem}
.contact-form input:focus,.contact-form select:focus,.contact-form textarea:focus{outline:none;border-color:var(--orange)}
.contact-form input::placeholder,.contact-form textarea::placeholder{color:rgba(255,255,255,.45)}
.contact-form select option{color:#111}
.contact-form textarea{resize:vertical}
.contact-form .btn{width:100%;justify-content:center;margin-top:6px}
.form-note{color:rgba(255,255,255,.62);font-size:.82rem;margin-top:12px;min-height:1em}
.page-h2{font-size:clamp(2rem,3.4vw,2.7rem);margin-bottom:14px}
.page-p{color:var(--stone);font-size:1.05rem;max-width:56ch;margin-bottom:36px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:42px}
@media(max-width:720px){.steps{grid-template-columns:1fr}}
.step{background:var(--mist);border:1px solid var(--line);border-radius:var(--radius);padding:24px}
.step-n{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;font-family:var(--display);font-weight:600;margin-bottom:14px}
.step h4{font-family:var(--display);font-size:1.1rem;margin-bottom:6px}
.step p{color:var(--stone);font-size:.92rem}
.form-light{max-width:760px;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:28px}
.form-2col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:560px){.form-2col{grid-template-columns:1fr}}
.form-light label{font-family:var(--display);font-size:.76rem;font-weight:500;letter-spacing:.05em;color:var(--stone);margin-bottom:7px}
.form-light input,.form-light select,.form-light textarea{width:100%;background:#fff;border:1px solid var(--line);border-radius:6px;padding:12px 14px;color:var(--ink);font-family:'Inter';font-size:.95rem}
.form-light input:focus,.form-light select:focus,.form-light textarea:focus{outline:none;border-color:var(--orange)}
.form-light textarea{resize:vertical}
.form-light .btn{width:100%;justify-content:center;margin-top:6px}
.form-light .form-note{color:var(--stone)}
.book-note{color:var(--stone);font-size:.9rem;margin-top:20px}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

<header>
  <div class="wrap nav">
    <a href="#/home" class="brand">
      <img class="logo" src="images/AP_logo_transparent.png" alt="A & P Mamas Developers">
      <span class="brand-name">A &amp; P Mamas Developers</span>

<!-- ===== HOME ===== -->
<div class="view active" id="view-home">
  <section class="hero">
    <div class="hero-slides" id="hero-slides"></div>
    <div class="hero-scrim"></div>
    <div class="wrap hero-inner">
      <span class="eyebrow" id="hero-eyebrow"></span>
      <h1 id="hero-h1"></h1>

    <div class="hi-actions">
      <a href="#/projects" class="btn btn-solid"><span id="hi-cta1"></span> <span class="ar">&rarr;</span></a>

</div>

<!-- ===== PROJECTS ===== -->
<section class="view page" id="view-projects"><div class="wrap">
  <div class="sec-head">
    <div><span class="eyebrow" id="sec-eyebrow"></span><h2 id="sec-h2"></h2></div>
    <span class="count" id="proj-count"></span>
  </div>
  <div class="grid" id="listings"></div>
</div></section>

<!-- ===== ABOUT ===== -->
<section class="view page" id="view-about"><div class="wrap about-grid">
  <div class="about-copy">
    <span class="eyebrow" id="about-eyebrow"></span>
    <h2 id="about-h2"></h2>
    <p id="about-p"></p>
    <a href="#/contact" class="btn btn-solid"><span id="about-cta"></span> <span class="ar">&rarr;</span></a>
  </div>
  <div class="about-img"><img src="images/IMG_0906.jpg" alt="A &amp; P Mamas Developers"></div>
</div></section>

<!-- ===== BOOK A VIEWING ===== -->
<section class="view page" id="view-book"><div class="wrap">
  <span class="eyebrow" id="book-eyebrow"></span>
  <h2 class="page-h2" id="book-h2"></h2>
  <p class="page-p" id="book-p"></p>
  <div class="steps">
    <div class="step"><span class="step-n">1</span><h4 id="s1t"></h4><p id="s1d"></p></div>
    <div class="step"><span class="step-n">2</span><h4 id="s2t"></h4><p id="s2d"></p></div>
    <div class="step"><span class="step-n">3</span><h4 id="s3t"></h4><p id="s3d"></p></div>
  </div>
  <form class="form-light" id="book-form" onsubmit="return submitBooking(event)">
    <div class="form-2col">
      <div class="fld"><label id="lb-name"></label><input id="b-name" type="text" required></div>
      <div class="fld"><label id="lb-email"></label><input id="b-email" type="email" required></div>
      <div class="fld"><label id="lb-phone"></label><input id="b-phone" type="tel"></div>
      <div class="fld"><label id="lb-project"></label><select id="b-project"></select></div>
      <div class="fld"><label id="lb-date"></label><input id="b-date" type="date"></div>
      <div class="fld"><label id="lb-time"></label><select id="b-time"></select></div>
    </div>
    <div class="fld"><label id="lb-msg"></label><textarea id="b-msg" rows="3"></textarea></div>
    <button class="btn btn-solid" type="submit" id="b-submit"></button>
    <p class="form-note"></p>
  </form>
  <p class="book-note" id="book-info"></p>
</div></section>

<!-- ===== CONTACT ===== -->
<section class="view contact" id="view-contact"><div class="wrap contact-grid">

const euro = n => "€"+n.toLocaleString(lang==='gr'?'el-GR':'en-GB');
const fStatus = p => (PSTATUS[p.status]?PSTATUS[p.status][lang]:p.status);
const fLoc = p => p.location[lang];
const fDesc = p => p.description[lang];
const fFeat = p => p.features[lang];
const fDeliv = p => (DELIVERY[p.delivery]?DELIVERY[p.delivery][lang]:p.delivery);

const availCount = p => p.units.filter(u=>u.status==="Available").length;
const minAvailPrice = p => { const a=p.units.filter(u=>u.status==="Available").map(u=>u.price); return a.length?Math.min(...a):Math.min(...p.units.map(u=>u.price)); };

function downloadPricelist(id){
  var p=PROJECTS.find(x=>x.id===id); if(!p)return;
  var J=window.jspdf&&window.jspdf.jsPDF;
  if(!J){ alert('The PDF tool is still loading — please try again in a moment.'); return; }
  var EN=T.en;
  var doc=new J({orientation:'landscape',unit:'mm',format:'a4'});
  doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.setTextColor(15,42,56);
  doc.text(CONFIG.companyName,14,16);
  doc.setFont('helvetica','normal'); doc.setFontSize(11); doc.setTextColor(90,90,90);
  doc.text(p.name+' — Price List  ('+p.location.en+')',14,23);
  var head=[[EN.thApt,EN.thFloor,EN.thBeds,EN.thInternal,EN.thCovTerr,EN.thTotalCov,EN.thUncovTerr,EN.thCommon,EN.thPrice]];
  var body=p.units.map(function(u){
    var price = u.status==='Sold'?EN.sold:(u.status==='Reserved'?EN.reserved:euro(u.price));
    return [u.apt,(FLOORS[u.floor]?FLOORS[u.floor].en:u.floor),(u.beds||'-'),u.internal,u.coveredTerr,u.totalCovered,u.uncoveredTerr,u.common,price];
  });
  doc.autoTable({head:head,body:body,startY:28,styles:{fontSize:8,cellPadding:2.2},headStyles:{fillColor:[15,42,56],textColor:255},alternateRowStyles:{fillColor:[244,245,246]},columnStyles:{8:{fontStyle:'bold'}}});
  var y=(doc.lastAutoTable?doc.lastAutoTable.finalY:40)+8;
  doc.setFontSize(8); doc.setTextColor(130,130,130);
  doc.text(EN.priceNote+'   '+new Date().toLocaleDateString('en-GB'),14,y);
  doc.save(p.name.replace(/[^A-Za-z0-9]+/g,'-')+'-pricelist.pdf');
}
function shareProject(id){
  var p=PROJECTS.find(x=>x.id===id); var url=location.href;
  if(navigator.share){ navigator.share({title:(p?p.name:document.title),url:url}).catch(function(){}); return; }
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(url).then(function(){alert(t('linkCopied'));},function(){prompt('Link:',url);}); }
  else { prompt('Link:',url); }
}
function swapImg(el,src){document.getElementById('mainImg').src=src;document.querySelectorAll('.thumb').forEach(x=>x.classList.remove('active'));el.classList.add('active');}

function fval(id){var e=document.getElementById(id);return e?e.value.trim():'';}
function sendForm(e, subject, data){
  e.preventDefault();
  var body=Object.keys(data).map(function(k){return k+': '+data[k];}).join('\n');
  var note=e.target.querySelector('.form-note');
  var setNote=function(m){ if(note)note.textContent=m; };
  var mailto=function(){ window.location.href='mailto:'+CONFIG.email+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body); };
  if(CONFIG.formEndpoint){
    fetch(CONFIG.formEndpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({subject:subject,to:CONFIG.email},data))})
      .then(function(){ setNote(t('formSuccessSent')); e.target.reset(); })
      .catch(function(){ mailto(); setNote(t('formSuccess')); });
  } else { mailto(); setNote(t('formSuccess')); }
  return false;
}
function submitBooking(e){
  var proj=fval('b-project');

    Project:proj, Date:fval('b-date'), Time:fval('b-time'), Message:fval('b-msg')
  });
}
function submitContact(e){

function showView(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));var e=document.getElementById(id);if(e)e.classList.add('active');window.scrollTo(0,0);}
function route(){
  var m=location.hash.match(/^#\/project\/(.+)$/);
  if(m){var p=PROJECTS.find(x=>x.id===m[1]);if(p){renderDetail(p);showView('detail');return;}}
  var h=location.hash.replace(/^#\//,'');
  var map={projects:'view-projects', about:'view-about', book:'view-book', contact:'view-contact'};
  var view=map[h]||'view-home';
  showView(view);
  if(view==='view-book' && window.__enq){ var s=document.getElementById('b-project'); if(s)s.value=window.__enq; window.__enq=''; }
}

/* ---------- hero: cinematic slideshow of all projects ---------- */
(function heroSlides(){
  const wrap=document.getElementById('hero-slides'); if(!wrap) return;
  const SLIDES = PROJECTS.map(p=>p.images[0]);
  wrap.innerHTML = SLIDES.map((s,i)=>'<img class="hero-slide'+(i===0?' active':'')+'" src="'+s+'" alt="" '+(i===0?'':'loading="lazy"')+'>').join('');
  const slides = wrap.querySelectorAll('.hero-slide');
  if(slides.length<2) return;
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce) return;
  let i=0;
  setInterval(function(){ slides[i].classList.remove('active'); i=(i+1)%slides.length; slides[i].classList.add('active'); }, 4800);
})();

/* ---------- 3D city background (Three.js) ---------- */
(function bg3d(){
  if(!window.THREE) return;
  var canvas=document.getElementById('bg3d'); if(!canvas) return;
  var renderer;
  try{ renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true}); }catch(e){ return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  var W=function(){return window.innerWidth;}, H=function(){return window.innerHeight;};
  renderer.setSize(W(),H(),false);
  var paper=0xf1f4f6;
  var scene=new THREE.Scene();
  scene.background=new THREE.Color(paper);
  scene.fog=new THREE.Fog(paper,16,54);
  var camera=new THREE.PerspectiveCamera(58,W()/H(),0.1,160);
  scene.add(new THREE.AmbientLight(0xffffff,0.78));
  var dir=new THREE.DirectionalLight(0xffffff,0.7); dir.position.set(8,14,6); scene.add(dir);
  var COLS=24, ROWS=24, GAP=1.5;
  var geo=new THREE.BoxGeometry(0.82,1,0.82);
  var mat=new THREE.MeshLambertMaterial({transparent:true,opacity:0.72});
  var count=COLS*ROWS;
  var mesh=new THREE.InstancedMesh(geo,mat,count);
  var navy=new THREE.Color(0x6f8aa0), navy2=new THREE.Color(0x8ba3b6), orange=new THREE.Color(0xefa877);
  var dummy=new THREE.Object3D(), idx=0;
  for(var i=0;i<COLS;i++){ for(var j=0;j<ROWS;j++){
    var x=(i-COLS/2)*GAP+(Math.random()-0.5)*0.35;
    var z=(j-ROWS/2)*GAP+(Math.random()-0.5)*0.35;
    var h=0.5+Math.pow(Math.random(),1.8)*3.4;
    dummy.position.set(x,h/2,z); dummy.scale.set(1,h,1); dummy.updateMatrix();
    mesh.setMatrixAt(idx,dummy.matrix);
    var c=(Math.random()<0.035)?orange:(Math.random()<0.5?navy:navy2);
    mesh.setColorAt(idx,c); idx++;
  }}
  mesh.instanceMatrix.needsUpdate=true; if(mesh.instanceColor) mesh.instanceColor.needsUpdate=true;
  scene.add(mesh);
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  window.addEventListener('resize',function(){ camera.aspect=W()/H(); camera.updateProjectionMatrix(); renderer.setSize(W(),H(),false); });
  var mx=0,my=0,tmx=0,tmy=0,scroll=0,tscroll=0,t=0.6, baseR=18;
  function frame(){
    var ang=t + mx*0.6;
    var r=baseR - Math.min(scroll*0.012,9);
    camera.position.x=Math.sin(ang)*r;
    camera.position.z=Math.cos(ang)*r;
    camera.position.y=7+Math.min(scroll*0.004,4)-my*1.4;
    camera.lookAt(0,1.4,0);
    renderer.render(scene,camera);
  }
  if(reduce){ frame(); return; }
  window.addEventListener('mousemove',function(e){ tmx=e.clientX/W()-0.5; tmy=e.clientY/H()-0.5; },{passive:true});
  window.addEventListener('scroll',function(){ tscroll=window.scrollY||window.pageYOffset||0; },{passive:true});
  function loop(){
    requestAnimationFrame(loop);
    if(document.hidden) return;
    t+=0.0012;
    mx+=(tmx-mx)*0.05; my+=(tmy-my)*0.05; scroll+=(tscroll-scroll)*0.06;
    frame();
  }
  loop();
})();
</script>
